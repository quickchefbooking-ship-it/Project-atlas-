name: Source manifest tests

on:
  push:
    branches:
      - main
      - "atlas/**"
      - "onepro-**"
    paths:
      - "tools/source_manifest.py"
      - "tests/test_source_manifest.py"
      - ".github/workflows/tests.yml"
      - "docs/source-reconciliation/**"
  pull_request:
    paths:
      - "tools/source_manifest.py"
      - "tests/test_source_manifest.py"
      - ".github/workflows/tests.yml"
      - "docs/source-reconciliation/**"

permissions:
  contents: read

jobs:
  source-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==8.3.2
      - name: Check out authoritative GitHub main snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: github-main
      - name: Generate authoritative GitHub main manifest
        run: python tools/source_manifest.py --repo-root github-main
      - name: Run source manifest regression tests
        run: python -m pytest -q tests/test_source_manifest.py
